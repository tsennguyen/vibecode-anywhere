# Profile: small — 1–2 vCPU, ≤4 GB RAM (cheap VPS, old laptop, Raspberry Pi 4/5 64-bit).
# Agent-only box: edit, test, commit, push. Heavy builds and e2e belong to CI.
PROFILE_LABEL="small (≤4 GB RAM)"
SWAP_GB=4                 # swap is what keeps a 4 GB box alive during npm install
MAX_HEAVY_JOBS=1          # dev server / build / e2e / docker: one at a time
NODE_HEAP_MB=1536         # NODE_OPTIONS=--max-old-space-size for the agent's shells
PLAYWRIGHT_DEFAULT=0      # Chromium + Next dev on 4 GB = swap storm; screenshot on CI/preview instead
DOCKER_ADVICE="Docker is allowed only for one small container at a time (e.g. a database). No docker compose stacks, no Testcontainers."
DISK_WARN_PCT=80
