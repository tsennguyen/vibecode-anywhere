# vibecode-anywhere — your personal config.
# Copy to config/hub.conf and edit (or paste PROMPT.md into your AI and let it fill this in).
# This file is plain bash, sourced by every script. It must NOT contain secrets
# (tokens, passwords, API keys). Secrets travel only inside the encrypted bundle (EXTRAS below).
#
# vibecode-anywhere (c) 2026 Nguyễn Việt Thành — MIT License.

# ─────────────────────────────────────────────────────────────────────────────
# 1. Who and where
# ─────────────────────────────────────────────────────────────────────────────
OWNER_NAME="Your Name"              # how the agent addresses you
REPLY_LANGUAGE="English"            # language the agent replies in on your phone (e.g. "Vietnamese")
HOST_NAME="my-host"                 # name shown in the phone app (Antigravity machine name, Claude session name)
TIMEZONE=""                         # e.g. "Asia/Ho_Chi_Minh"; empty = leave the host as is (Linux/macOS only)

# What kind of always-on machine runs the agent (docs/HOSTS.md):
#   vps          rented server — use Ubuntu 22.04/24.04
#   workstation  desktop PC / workstation at home or office  (Linux, Windows or macOS)
#   minipc       mini PC / NUC                                (Linux or Windows)
#   laptop       laptop kept plugged in, lid may be closed    (Linux, Windows or macOS)
#   mac          Mac mini / Mac Studio                        (macOS)
#   sbc          Raspberry Pi 4/5 class, 64-bit OS            (Linux)
# The host OS itself is detected automatically.
HOST_KIND="vps"
HOST_SHARED=0                       # 1 = family/colleagues also use this computer → agent stays out of their way
SSH_SERVER="auto"                   # auto = enable an SSH server on home machines (phone rescue line); VPSes have one

# Folder that holds all your repos.
#   SOURCE_ROOT = on your main computer (where you run pack.sh)
#     macOS:              "$HOME/code"          (e.g. /Users/alice/code)
#     Linux:              "$HOME/code"
#     Windows (Git Bash): "/c/Users/alice/code" (C:\Users\alice\code)
#   HOST_ROOT   = on the always-on machine the agent runs on (same forms: Linux/macOS "$HOME/code",
#                 Windows host "/c/Users/alice/code")
SOURCE_ROOT="$HOME/code"
HOST_ROOT="$HOME/code"

# Optional: make the source machine's absolute path also work on the host, via a symlink
# (useful when your AGENTS.md / docs / IDE projects contain absolute paths).
#   e.g. MIRROR_PATH="/Users/alice/code"  -> host gets /Users/alice/code -> $HOST_ROOT
# Linux/macOS hosts only. Leave empty when either side is Windows.
MIRROR_PATH=""

# Git identity used for commits on the host. Empty = keep whatever git already has.
GIT_NAME=""
GIT_EMAIL=""

# ─────────────────────────────────────────────────────────────────────────────
# 2. Machine size → see profiles/*.conf
#    auto | small (≤4 GB RAM) | medium (~8 GB) | large (≥16 GB)
# ─────────────────────────────────────────────────────────────────────────────
PROFILE="auto"

# ─────────────────────────────────────────────────────────────────────────────
# 3. What to install on the host (bootstrap.sh)
# ─────────────────────────────────────────────────────────────────────────────
# Coding agents you will drive from the phone. First one = primary (the others are fallbacks).
#   antigravity | claude | codex
AGENTS=(antigravity claude)

# Language stacks: node pnpm bun python-uv java docker go rust
#   docker = Docker Engine on Linux, Docker Desktop on Windows (needs WSL2), colima or Docker Desktop on macOS
STACKS=(node pnpm python-uv docker)
NODE_VERSION="22"
JAVA_VERSION="21"
DOCKER_ON_MAC="colima"              # colima (headless, no GUI) | desktop (Docker Desktop)

# Extra CLIs: gh vercel supabase tailscale
TOOLS=(gh vercel)

# Install Playwright Chromium (UI screenshots / e2e). auto = follow the profile.
INSTALL_PLAYWRIGHT="auto"

# Docker images to pre-pull (saves time + bandwidth later).
DOCKER_IMAGES=()                    # e.g. (postgres:17 redis:7)

# Windows hosts only (bootstrap.ps1):
WINDOWS_BLOCK_AUTO_REBOOT=1         # 1 = Windows Update never reboots while you are signed in (you reboot when home)
WINDOWS_SSH_SHELL="bash"            # shell for SSH sessions: bash (Git Bash, matches RESCUE commands) | powershell

# ─────────────────────────────────────────────────────────────────────────────
# 4. Repos (paths relative to SOURCE_ROOT / HOST_ROOT)
# ─────────────────────────────────────────────────────────────────────────────
# "path|clone url|short description for the agent". Parents before nested repos.
REPOS=(
  "my-app|https://github.com/you/my-app.git|Main product (Next.js). Priority #1."
  # "notes|https://github.com/you/notes.git|Personal notes and plans"
)

# Git worktrees: "worktree path|parent repo path". Recreated with `git worktree add`.
WORKTREES=(
  # "my-app-wt2|my-app"
)

# Repos that are PUBLIC: the agent is told never to commit AI files or personal data there.
PUBLIC_REPOS=(
  # "my-app"
)

# Branches nobody pushes to directly. save-all.sh moves work on these to wip/rescue-<time>.
PROTECTED_BRANCHES=(main master dev develop prod production)

# ─────────────────────────────────────────────────────────────────────────────
# 5. Files git does not carry (go ONLY into the encrypted bundle)
# ─────────────────────────────────────────────────────────────────────────────
# Relative to SOURCE_ROOT: .env files, local config, folders outside git.
EXTRAS=(
  # "my-app/.env.local"
  # "my-app/.vercel/project.json"
  # "notes/drafts"
)

# Relative to $HOME: agent configuration worth carrying (skills, MCP, settings).
# Login tokens are ALWAYS skipped (auth.json, .credentials.json, oauth*, *token*): log in again on the host.
HOME_EXTRAS=(
  # ".gemini/config/plugins"
  # ".gemini/config/mcp_config.json"
  # ".claude/settings.json"
  # ".claude/skills"
  # ".codex/config.toml"
  # ".codex/prompts"
)

# ─────────────────────────────────────────────────────────────────────────────
# 6. Dependencies (install-deps.sh) — auto-detected from lockfiles; override here
# ─────────────────────────────────────────────────────────────────────────────
# "path|command" runs INSTEAD of auto-detection for that repo (command runs inside the repo).
DEP_COMMANDS=(
  # "my-app|pnpm install --frozen-lockfile && pnpm exec lefthook install"
)
# "path|command" quick checks after install. Keep them cheap.
SMOKE_TESTS=(
  # "my-app|npm test"
)

# ─────────────────────────────────────────────────────────────────────────────
# 7. Where the bundle goes
# ─────────────────────────────────────────────────────────────────────────────
VIBE_OUT="$HOME/vibecode-out"       # pack.sh writes here; copy this folder to the host + a cloud drive
PASS_FILE="$HOME/.vibecode-pass"    # bundle passphrase. Keep a copy on your phone, NOT next to the bundle.

# Your own extra rules for the agent: write them in config/rules.extra.md (Markdown).
# They are appended to the generated AGENTS.md.
